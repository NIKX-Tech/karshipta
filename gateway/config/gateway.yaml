# Gateway runtime config. Loaded once at startup by WebsocketTransport::from_config()
# (see gateway/docs/websocket-transport.md). Safe to edit and commit: this file holds
# operator-facing settings, not generated state (unlike fleet_state.yaml, gitignored).

websocket:
  # Loopback only by default: the websocket server is not reachable from other
  # machines on the network. Cross-machine access should go through the relay
  # transport instead (see gateway/docs/relay-transport.md), not by widening this bind.
  host: 127.0.0.1
  port: 8765

  # Escape hatch for a bare-LAN bind (e.g. host: 0.0.0.0 or a specific LAN
  # address). Off by default. If you turn this on, the websocket server has
  # NO AUTHENTICATION: anyone who can reach host:port can command every
  # connected ward. Only acceptable on a trusted, isolated network, and the
  # gateway logs a loud warning on every startup while this is true.
  allow_lan_bind: false
