# Gateway runtime config. Loaded once at startup. Safe to edit and commit: this file
# holds operator-facing settings, not generated state (unlike fleet_state.yaml,
# gitignored) and no secrets (relay device credentials live in their own gitignored
# file, see the relay section below).

# Which Transport implementation main() constructs: "websocket" (default) listens
# for inbound connections locally; "relay" connects outward through relayly for
# remote operations (see gateway/docs/relay-transport.md). "relay" only works when
# the gateway was built with -DKARSHIPTA_GATEWAY_ENABLE_RELAY=ON; main() logs an
# error and falls back to websocket otherwise, rather than failing to start.
transport: websocket

websocket:
  # Loopback only by default: the websocket server is not reachable from other
  # machines on the network. Cross-machine access should go through the relay
  # transport instead (see gateway/docs/relay-transport.md), not by widening this bind.
  host: 127.0.0.1
  port: 8765

  # Escape hatch for a bare-LAN bind (e.g. host: 0.0.0.0 or a specific LAN
  # address). Off by default. If you turn this on, the websocket server has
  # NO AUTHENTICATION: anyone who can reach host:port can command every
  # connected ward. Only acceptable on a trusted, isolated network, and the
  # gateway logs a loud warning on every startup while this is true.
  allow_lan_bind: false

# Only read when transport: relay above. url is not a secret, safe to commit.
# Device credentials (device_id, private_key_path, device_token) are NOT here -
# see relay_credentials.yaml.example and gateway/docs/relay-transport.md's
# "Credentials" section.
relay:
  url: wss://relay.example.com/ws
  credentials_path: gateway/config/relay_credentials.yaml

# Herald HTTP ingestion (github issue #101): accepts a Herald message
# (github.com/NIKX-Tech/herald) over POST /herald and reports it as a ward,
# same as any MAVLink ward. See gateway/docs/herald-ingest.md.
herald:
  # Same loopback-by-default policy as websocket.host above.
  host: 127.0.0.1
  http_port: 8766

  # Same escape hatch as websocket.allow_lan_bind, same warning. A Herald
  # source (a livestock tag, a sensor) is usually not on the same machine as
  # the gateway, so this is the more likely of the two to actually need
  # turning on; it carries the same NO AUTHENTICATION caveat.
  allow_lan_bind: false
