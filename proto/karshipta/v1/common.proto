syntax = "proto3";

package karshipta.v1;

// Geographic position. WGS84.
message GeoPoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  float altitude_msl_m = 3;   // above mean sea level
  float altitude_rel_m = 4;   // relative to home/takeoff
}

// Velocity in NED frame (north-east-down), m/s.
message VelocityNed {
  float north_m_s = 1;
  float east_m_s = 2;
  float down_m_s = 3;
}

// The kind of ward: flight classes (an autopilot-controlled vehicle) or
// non-flight classes (a tracked entity with no autopilot at all, e.g. a
// livestock GPS tag). WardState.flight is populated only for the former.
enum WardClass {
  WARD_CLASS_UNSPECIFIED = 0;
  WARD_CLASS_MULTIROTOR = 1;
  WARD_CLASS_FIXED_WING = 2;
  WARD_CLASS_VTOL = 3;
  WARD_CLASS_HELICOPTER = 4;
  WARD_CLASS_GROUND = 5;
  WARD_CLASS_UNDERWATER = 6;
  WARD_CLASS_SURFACE_VESSEL = 7;
  WARD_CLASS_LIVESTOCK_TAG = 8;
  WARD_CLASS_GENERIC_TRACKER = 9;
}

enum FlightMode {
  FLIGHT_MODE_UNSPECIFIED = 0;
  FLIGHT_MODE_MANUAL = 1;
  FLIGHT_MODE_HOLD = 2;
  FLIGHT_MODE_MISSION = 3;
  FLIGHT_MODE_RETURN = 4;
  FLIGHT_MODE_TAKEOFF = 5;
  FLIGHT_MODE_LAND = 6;
  FLIGHT_MODE_OFFBOARD = 7;
  FLIGHT_MODE_POSITION = 8;
  FLIGHT_MODE_UNKNOWN = 9;
}

enum GpsFixType {
  GPS_FIX_TYPE_UNSPECIFIED = 0;
  GPS_FIX_TYPE_NO_FIX = 1;
  GPS_FIX_TYPE_FIX_2D = 2;
  GPS_FIX_TYPE_FIX_3D = 3;
  GPS_FIX_TYPE_RTK = 4;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_CRITICAL = 3;
  SEVERITY_EMERGENCY = 4;
}

// What is actually producing this ward's telemetry. Distinct from a
// gateway's own local/remote transport concern (that's about how the data
// reaches a console, not what generated it): SITL is a real autopilot
// binary flying simulated physics (a legitimate, common self-hosted setup,
// see the console's "Add simulated ward" onboarding flow), while
// SYNTHETIC means no autopilot exists at all, only demo math standing in
// for one (the OSS console's own FakeGateway, or a hosted demo fleet).
// Conflating those two into one "is this simulated" boolean would be
// inaccurate, so this is an enum instead.
enum WardOrigin {
  WARD_ORIGIN_UNSPECIFIED = 0;
  WARD_ORIGIN_HARDWARE = 1;
  WARD_ORIGIN_SITL = 2;
  WARD_ORIGIN_SYNTHETIC = 3;
}
