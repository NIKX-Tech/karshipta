syntax = "proto3";

package karshipta.v1;

import "karshipta/v1/common.proto";

// ---------- Commands (console -> gateway) ----------

message ArmCommand {}
message DisarmCommand { bool force = 1; }
message TakeoffCommand { float altitude_rel_m = 1; }
message LandCommand {}
message ReturnToLaunchCommand {}
message GotoCommand {
  GeoPoint target = 1;
  float speed_m_s = 2;         // 0 = autopilot default
}
message StartMissionCommand {}
message PauseMissionCommand {}

message Command {
  string command_id = 1;       // uuid generated by sender
  string vehicle_id = 2;
  uint64 timestamp_ms = 3;
  oneof action {
    ArmCommand arm = 10;
    DisarmCommand disarm = 11;
    TakeoffCommand takeoff = 12;
    LandCommand land = 13;
    ReturnToLaunchCommand rtl = 14;
    GotoCommand goto = 15;
    StartMissionCommand start_mission = 16;
    PauseMissionCommand pause_mission = 17;
  }
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;   // gateway forwarded to autopilot
  COMMAND_STATUS_EXECUTING = 2;
  COMMAND_STATUS_SUCCESS = 3;
  COMMAND_STATUS_REJECTED = 4;   // autopilot or gateway refused
  COMMAND_STATUS_TIMEOUT = 5;
}

message CommandAck {
  string command_id = 1;
  string vehicle_id = 2;
  CommandStatus status = 3;
  string message = 4;          // reason when rejected
}

// ---------- Missions ----------

enum MissionAction {
  MISSION_ACTION_UNSPECIFIED = 0;
  MISSION_ACTION_WAYPOINT = 1;
  MISSION_ACTION_TAKEOFF = 2;
  MISSION_ACTION_LAND = 3;
  MISSION_ACTION_RTL = 4;
  MISSION_ACTION_HOLD = 5;
}

message MissionItem {
  uint32 seq = 1;
  MissionAction action = 2;
  GeoPoint position = 3;
  float speed_m_s = 4;         // 0 = default
  float hold_time_s = 5;
  float acceptance_radius_m = 6;
}

message Mission {
  string mission_id = 1;       // uuid
  string vehicle_id = 2;
  string name = 3;
  repeated MissionItem items = 4;
  uint32 repeat_count = 5;     // extra passes after the first: 0 = fly once, N = fly N+1 times total
}

message MissionProgress {
  string vehicle_id = 1;
  string mission_id = 2;
  uint32 current_seq = 3;
  uint32 total_items = 4;
  bool finished = 5;
}

// ---------- Mission file import / download ----------

enum MissionFileFormat {
  MISSION_FILE_FORMAT_UNSPECIFIED = 0;
  MISSION_FILE_FORMAT_QGC_PLAN = 1;
  MISSION_FILE_FORMAT_MISSION_PLANNER_WPL = 2;
}

message MissionFileUpload {
  string vehicle_id = 1;
  MissionFileFormat format = 2;
  string raw_content = 3;       // file contents, not a path
}

message MissionDownloadRequest {
  string vehicle_id = 1;
}
