syntax = "proto3";

package karshipta.v1;

import "karshipta/v1/common.proto";

// Static identity of a ward, sent on connect and on change.
message WardInfo {
  string ward_id = 1;          // stable ID assigned by the gateway, e.g. "sitl-1"
  WardClass ward_class = 2;
  string autopilot = 3;        // "PX4", "ArduPilot"; empty when this ward has no flight autopilot
  string firmware_version = 4; // this ward's own firmware, if it reports one; independent of ward_class
  uint32 mavlink_system_id = 5; // 0 when not connected via MAVLink; independent of ward_class, since a non-flight ward can still speak MAVLink
  WardOrigin origin = 6;
}

message Battery {
  float voltage_v = 1;
  float remaining_pct = 2;     // 0.0 to 100.0, -1 if unknown
}

message Gps {
  GpsFixType fix_type = 1;
  uint32 num_satellites = 2;
  float hdop = 3;
}

// Autopilot-specific state: only meaningful for a ward under active or
// simulated flight control (a flight-mode state machine, an armed state, an
// airborne state). Absent (unset) for non-flight wards - a livestock tag has
// no autopilot to be "armed" or "in mission mode", even though it still
// reports position, velocity, and heading like any moving ward (those stay
// on WardState directly, not nested here, for exactly that reason).
message FlightState {
  FlightMode flight_mode = 1;
  bool armed = 2;
  bool in_air = 3;
  // Live per-sensor calibration health (karshipta#248), mirroring
  // mavsdk::Telemetry::Health directly - a current pass/fail snapshot,
  // not a calibration history: neither MAVSDK nor the underlying MAVLink
  // protocol records when a sensor was last calibrated, only whether it
  // currently passes. No level_horizon_calibration_ok field exists:
  // MAVSDK's own Health struct has no equivalent for it either - level
  // horizon is a trim correction, not a pass/fail calibration state.
  bool gyrometer_calibration_ok = 4;
  bool accelerometer_calibration_ok = 5;
  bool magnetometer_calibration_ok = 6;
}

// Live state of one ward. Published at 2 to 10 Hz per ward.
message WardState {
  string ward_id = 1;
  // karshipta#268: for a Herald ward this is the device/event time parsed
  // from the vendor payload, which can lag ingestion_ms by a lot (store-
  // and-forward, intermittent cellular - exactly the case Herald exists
  // for). For a MAVLink ward there is no reliable absolute device-side
  // clock to read off the wire today (PX4/ArduPilot report boot-relative
  // time, not wall-clock UTC, in routine telemetry messages), so this is
  // set to the same gateway wall-clock value as ingestion_ms below; the two
  // fields read identically for MAVLink until a real device-time source is
  // wired in, which is a separate, larger piece of work, not this field.
  uint64 timestamp_ms = 2;     // unix epoch milliseconds, device/event clock where known
  // karshipta#268: unix epoch milliseconds when the gateway itself received
  // or computed this reading, independent of timestamp_ms above. Subtracting
  // the two gives the event-to-ingestion delay the validation matrix on
  // that issue calls for; comparing this field alone against "now" gives
  // elapsed-gateway-time, a different, non-interchangeable question.
  uint64 ingestion_ms = 12;
  GeoPoint position = 3;
  VelocityNed velocity = 4;    // any moving ward has this, not flight-specific
  float heading_deg = 5;       // direction of travel, 0 to 360 true north; any moving ward has this
  Battery battery = 6;
  Gps gps = 7;
  bool health_ok = 8;          // true when the ward is reporting normally (autopilot health checks for flight wards, basic reporting sanity for others)
  bool connected = 9;          // false when the gateway lost the ward's link, or (Herald) when no message has arrived within the configured staleness timeout
  FlightState flight = 10;     // unset for non-flight wards
  repeated string tags = 11;   // operator-defined labels, e.g. "herd-3", "north-region"
}

// Human-relevant event from a ward or the gateway itself.
message Event {
  string ward_id = 1;          // empty = gateway-level event
  uint64 timestamp_ms = 2;
  Severity severity = 3;
  string code = 4;             // machine-readable, e.g. "LOW_BATTERY", "LINK_LOST"
  string message = 5;          // human-readable text
}
