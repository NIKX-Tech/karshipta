syntax = "proto3";

package karshipta.v1;

import "karshipta/v1/common.proto";
import "karshipta/v1/command.proto";

// ---------- Fleet management (console -> gateway) ----------
//
// Lets an operator add and remove wards from the console UI instead of
// hand-editing gateway config. The gateway owns persistence (its config file
// becomes the durable form of these requests) and answers every request with
// a WardConfigAck; rejections carry a human-readable reason, per the
// repo's observability rule.

// Adds a ward to the gateway's fleet; the gateway starts connecting to it
// immediately (reconnect-forever) and persists it across restarts. This
// connects any MAVLink-speaking ward, flight-capable or not - a MAVLink
// tracker/tag ward provisions through this exact same message.
message AddWard {
  string request_id = 1;         // uuid generated by sender, echoed in the ack
  string ward_id = 2;            // stable operator-chosen id, e.g. "alpha-1"
  string name = 3;               // human-friendly label; empty = use ward_id
  WardClass ward_class = 4;
  string connection_url = 5;     // e.g. "udpin://0.0.0.0:14540", "serial:///dev/ttyUSB0:57600"
  uint32 mavlink_system_id = 6;  // 0 = bind to the first autopilot on the endpoint
}

// Removes a ward from the fleet and drops its MAVLink connection. The
// gateway must reject removal of an armed or airborne ward.
message RemoveWard {
  string request_id = 1;
  string ward_id = 2;
}

enum WardConfigStatus {
  WARD_CONFIG_STATUS_UNSPECIFIED = 0;
  WARD_CONFIG_STATUS_ACCEPTED = 1;  // persisted; connection attempt underway
  WARD_CONFIG_STATUS_REJECTED = 2;  // reason in message
}

// Answer to AddWard / RemoveWard, correlated by request_id.
message WardConfigAck {
  string request_id = 1;
  string ward_id = 2;
  WardConfigStatus status = 3;
  string message = 4;            // reason when rejected
}

// ---------- Fleet grouping (console -> gateway) ----------
//
// A Fleet is a named, persistent group of Wards, not itself a physical
// thing - it is a saved selection (fleet-mission-model.md). Membership is
// many to many: a Ward can belong to more than one Fleet. The gateway owns
// persistence (SQLite, not the YAML fleet_state.yaml wards already use -
// this is relational, not a flat list) and syncs the current set to every
// client on connect, one Fleet message per fleet.

message Fleet {
  string fleet_id = 1;
  string name = 2;
  string description = 3;
  repeated string ward_ids = 4;  // many-to-many membership
}

message CreateFleet {
  string request_id = 1;
  string name = 2;
  string description = 3;
}

// Despite the name (kept for wire stability), this updates both editable
// fields at once: name and description. There is no separate message for
// description alone - the console always edits them together.
message RenameFleet {
  string request_id = 1;
  string fleet_id = 2;
  string name = 3;
  string description = 4;
}

message DeleteFleet {
  string request_id = 1;
  string fleet_id = 2;
}

message AddWardToFleet {
  string request_id = 1;
  string fleet_id = 2;
  string ward_id = 3;
}

message RemoveWardFromFleet {
  string request_id = 1;
  string fleet_id = 2;
  string ward_id = 3;
}

enum FleetAckStatus {
  FLEET_ACK_STATUS_UNSPECIFIED = 0;
  FLEET_ACK_STATUS_ACCEPTED = 1;
  FLEET_ACK_STATUS_REJECTED = 2;  // reason in message
}

// Answer to CreateFleet / RenameFleet / DeleteFleet / AddWardToFleet /
// RemoveWardFromFleet, correlated by request_id. fleet_id lets any
// connected client (not just the requester, which already knows it from
// its own local tracker) learn which fleet a broadcast ack refers to -
// essential for delete, which has no updated Fleet object to broadcast
// alongside it. Mirrors WardConfigAck.ward_id.
message FleetAck {
  string request_id = 1;
  FleetAckStatus status = 2;
  string message = 3;
  string fleet_id = 4;
}

// ---------- Zones (console -> gateway) ----------
//
// A Zone is a named polygon: keep-in (operational/safe area) or keep-out
// (no-fly). v0 is advisory only - a mission waypoint inside a keep-out Zone
// or outside every keep-in Zone warns the console operator before upload,
// it does not block it. Enforcement pushed to the autopilot (MAVSDK
// geofence) is a later, separately-tracked item (fleet-mission-model.md).
// Geometry (vertices) is fixed at creation; only name/type/altitude bounds
// can change afterward, matching the console's v0 editing scope.

enum ZoneType {
  ZONE_TYPE_UNSPECIFIED = 0;
  ZONE_TYPE_KEEP_IN = 1;
  ZONE_TYPE_KEEP_OUT = 2;
}

message Zone {
  string zone_id = 1;
  string name = 2;
  ZoneType type = 3;
  repeated karshipta.v1.GeoPoint vertices = 4;  // horizontal boundary; altitude fields on GeoPoint are unused here
  optional float altitude_min_m = 5;            // unset = no lower bound
  optional float altitude_max_m = 6;            // unset = no upper bound
}

message CreateZone {
  string request_id = 1;
  string name = 2;
  ZoneType type = 3;
  repeated karshipta.v1.GeoPoint vertices = 4;  // at least 3 required
  optional float altitude_min_m = 5;
  optional float altitude_max_m = 6;
}

message UpdateZone {
  string request_id = 1;
  string zone_id = 2;
  string name = 3;
  ZoneType type = 4;
  optional float altitude_min_m = 5;
  optional float altitude_max_m = 6;
}

message DeleteZone {
  string request_id = 1;
  string zone_id = 2;
}

enum ZoneAckStatus {
  ZONE_ACK_STATUS_UNSPECIFIED = 0;
  ZONE_ACK_STATUS_ACCEPTED = 1;
  ZONE_ACK_STATUS_REJECTED = 2;  // reason in message
}

// Answer to CreateZone / UpdateZone / DeleteZone, correlated by request_id.
// zone_id mirrors FleetAck.fleet_id, same reason: the only way any client
// other than the requester learns which zone a broadcast delete-ack removed.
message ZoneAck {
  string request_id = 1;
  ZoneAckStatus status = 2;
  string message = 3;
  string zone_id = 4;
}

// ---------- Fleet mission (console -> gateway) ----------
//
// A FleetMission is a trackable, persisted unit: an operator plans a
// SEPARATE route per selected Ward (no two WardMissionPlans in one
// FleetMission share a waypoint - sending the same route to multiple
// wards at once puts them on a literal collision course), submits them
// together, and can see the result as one entity: status, stop, remove,
// edit. Replaces an earlier flat-broadcast design (one shared route fanned
// out to every ward) that had exactly this hazard; that field number is
// retired below, not reused.
//
// Still explicitly out of scope, unchanged from before (fleet-mission-model.md):
// automatic area splitting, role assignment, or any real multi-agent task
// allocation. Each ward's route is planned by the operator, not derived.

enum WardMissionStatus {
  WARD_MISSION_STATUS_UNSPECIFIED = 0;
  WARD_MISSION_STATUS_UPLOADING = 1;  // upload accepted, not yet confirmed active
  WARD_MISSION_STATUS_ACTIVE = 2;
  WARD_MISSION_STATUS_REJECTED = 3;   // reason in message; never started
  WARD_MISSION_STATUS_STOPPING = 4;   // stop dispatched, awaiting CommandAck
  WARD_MISSION_STATUS_STOPPED = 5;
}

enum FleetMissionStatus {
  FLEET_MISSION_STATUS_UNSPECIFIED = 0;
  FLEET_MISSION_STATUS_ACTIVE = 1;    // at least one ward is UPLOADING/ACTIVE
  FLEET_MISSION_STATUS_STOPPING = 2;  // stop requested, not every ward confirmed yet
  FLEET_MISSION_STATUS_STOPPED = 3;   // every ward is STOPPED or REJECTED
}

// One ward's own independent route within a FleetMission.
message WardMissionPlan {
  string ward_id = 1;
  repeated karshipta.v1.MissionItem items = 2;
}

// Current (not historical) per-ward status inside a FleetMission.
message WardMissionState {
  string ward_id = 1;
  WardMissionStatus status = 2;
  string message = 3;       // rejection/stop-failure reason, empty otherwise
  string mission_id = 4;    // this ward's own Mission.mission_id, for correlating MissionProgress
}

message FleetMission {
  string fleet_mission_id = 1;   // gateway-assigned
  string fleet_id = 2;           // empty = an ad-hoc ward selection, not tied to a saved Fleet
  string mission_name = 3;
  uint32 repeat_count = 4;
  repeated WardMissionPlan ward_plans = 5;    // one per ward; ward_ids is implicit here
  repeated WardMissionState ward_states = 6;
  FleetMissionStatus status = 7;
  uint64 created_at_ms = 8;
}

message CreateFleetMission {
  string request_id = 1;
  string fleet_id = 2;
  string mission_name = 3;
  repeated WardMissionPlan ward_plans = 4;
  uint32 repeat_count = 5;
}

enum FleetMissionAckStatus {
  FLEET_MISSION_ACK_STATUS_UNSPECIFIED = 0;
  FLEET_MISSION_ACK_STATUS_ACCEPTED = 1;  // the FleetMission itself was created/updated; per-ward outcomes are in ward_states
  FLEET_MISSION_ACK_STATUS_REJECTED = 2;  // reason in message
}

// Answers Create/Stop/Remove/UpdateFleetMissionRoutes, correlated by
// request_id. fleet_mission_id mirrors FleetAck.fleet_id: how a
// non-requesting client learns which entity a broadcast ack refers to.
message FleetMissionAck {
  string request_id = 1;
  string fleet_mission_id = 2;
  FleetMissionAckStatus status = 3;
  string message = 4;
}

enum FleetMissionStopAction {
  FLEET_MISSION_STOP_ACTION_UNSPECIFIED = 0;  // gateway treats as RTL
  FLEET_MISSION_STOP_ACTION_RTL = 1;
  FLEET_MISSION_STOP_ACTION_HOLD = 2;
  FLEET_MISSION_STOP_ACTION_LAND = 3;
}

message StopFleetMission {
  string request_id = 1;
  string fleet_mission_id = 2;
  FleetMissionStopAction action = 3;
}

// The gateway rejects unless every ward_state is STOPPED or REJECTED -
// removing the record never touches a ward's connection or flight state,
// only tracking rows, so this only checks already-persisted status, not
// live telemetry (that check already happened inside StopFleetMission).
message RemoveFleetMission {
  string request_id = 1;
  string fleet_mission_id = 2;
}

// Re-plans routes for an existing FleetMission ("Edit"). Submitting
// re-plans AND re-dispatches (not just saves a draft). Gateway rejects
// unless every ward_state is STOPPED/REJECTED, same gate as
// RemoveFleetMission - never let a route change land under an active
// mission, the exact hazard this whole message family exists to remove.
message UpdateFleetMissionRoutes {
  string request_id = 1;
  string fleet_mission_id = 2;
  string mission_name = 3;
  repeated WardMissionPlan ward_plans = 4;
  uint32 repeat_count = 5;
}
