syntax = "proto3";

package karshipta.v1;

import "karshipta/v1/common.proto";

// ---------- Fleet management (console -> gateway) ----------
//
// Lets an operator add and remove vehicles from the console UI instead of
// hand-editing gateway config. The gateway owns persistence (its config file
// becomes the durable form of these requests) and answers every request with
// a VehicleConfigAck; rejections carry a human-readable reason, per the
// repo's observability rule.

// Adds a vehicle to the gateway's fleet; the gateway starts connecting to it
// immediately (reconnect-forever) and persists it across restarts.
message AddVehicle {
  string request_id = 1;         // uuid generated by sender, echoed in the ack
  string vehicle_id = 2;         // stable operator-chosen id, e.g. "alpha-1"
  string name = 3;               // human-friendly label; empty = use vehicle_id
  VehicleType type = 4;
  string connection_url = 5;     // e.g. "udpin://0.0.0.0:14540", "serial:///dev/ttyUSB0:57600"
  uint32 mavlink_system_id = 6;  // 0 = bind to the first autopilot on the endpoint
}

// Removes a vehicle from the fleet and drops its MAVLink connection. The
// gateway must reject removal of an armed or airborne vehicle.
message RemoveVehicle {
  string request_id = 1;
  string vehicle_id = 2;
}

enum VehicleConfigStatus {
  VEHICLE_CONFIG_STATUS_UNSPECIFIED = 0;
  VEHICLE_CONFIG_STATUS_ACCEPTED = 1;  // persisted; connection attempt underway
  VEHICLE_CONFIG_STATUS_REJECTED = 2;  // reason in message
}

// Answer to AddVehicle / RemoveVehicle, correlated by request_id.
message VehicleConfigAck {
  string request_id = 1;
  string vehicle_id = 2;
  VehicleConfigStatus status = 3;
  string message = 4;            // reason when rejected
}
