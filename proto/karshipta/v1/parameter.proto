syntax = "proto3";

package karshipta.v1;

// ---------- Parameters (console <-> gateway) ----------
//
// Raw MAVLink parameter access (karshipta#210): PID gains, RTL/failsafe
// thresholds, and everything else normally tuned in QGroundControl or
// Mission Planner. Nothing else on this wire reaches the actual MAVLink
// parameter protocol - every other message is a coarse, named command.
// MAVSDK's Param plugin already exposes it (get_all_params(),
// get/set_param_int(), get/set_param_float()); this is the wire surface
// for it, message shapes only - gateway wiring (karshipta#211) and console
// UI (karshipta#212) land separately.
//
// Scoped to int and float parameters only, matching MAVSDK's own
// AllParams.int_params/float_params split (MAVLink's PARAM_VALUE is
// typed, never a generic number). MAVSDK's AllParams also carries
// custom_params (string-valued, <=128 bytes), but that's the extended
// param protocol (PARAM_EXT_*), used by camera/gimbal components, not the
// standard autopilot parameter set PX4/ArduPilot expose - out of scope
// here, revisit only if a future ward class actually needs it.
//
// ward_id-scoped like Command, not fleet-scoped: a parameter always
// belongs to exactly one ward's own flight controller.

message GetParams {
  string request_id = 1;         // uuid generated by sender, echoed in the response
  string ward_id = 2;
}

enum ParamType {
  PARAM_TYPE_UNSPECIFIED = 0;
  PARAM_TYPE_INT = 1;
  PARAM_TYPE_FLOAT = 2;
}

// One parameter's name and current value. name is the raw MAVLink
// PARAM_ID (e.g. "MPC_LAND_SPEED"), never a human-friendly label - that
// curation/naming happens console-side (karshipta#212's own scope), not
// on the wire.
message Param {
  string name = 1;
  ParamType type = 2;
  oneof value {
    int32 int_value = 3;
    float float_value = 4;
  }
}

enum ParamListStatus {
  PARAM_LIST_STATUS_UNSPECIFIED = 0;
  PARAM_LIST_STATUS_SUCCESS = 1;
  PARAM_LIST_STATUS_REJECTED = 2;  // reason in message, e.g. unknown ward_id or vehicle unreachable
}

// Response to GetParams, correlated by request_id. Carries the ward's
// complete parameter set in one message, not paginated - matching
// get_all_params()'s own one-shot shape; a vehicle's full set is a few
// hundred KB at most, well under kMaxEnvelopeBytes (main.cpp).
message ParamList {
  string request_id = 1;
  string ward_id = 2;
  ParamListStatus status = 3;
  string message = 4;              // reason when rejected
  repeated Param params = 5;
}

message SetParam {
  string request_id = 1;           // uuid generated by sender, echoed in the ack
  string ward_id = 2;
  Param param = 3;                 // name + typed value to set
}

enum ParamAckStatus {
  PARAM_ACK_STATUS_UNSPECIFIED = 0;
  PARAM_ACK_STATUS_SUCCESS = 1;
  // Reason in message: MAVSDK's own Param::Result is far more specific
  // than this one status (DoesNotExist, ValueOutOfRange, PermissionDenied,
  // ReadOnly, TypeMismatch, Timeout, ...) - karshipta#211 must carry that
  // specific reason through as text here, never collapse it to a bare
  // "rejected" the way a first pass might be tempted to.
  PARAM_ACK_STATUS_REJECTED = 2;
}

// Response to SetParam, correlated by request_id. Not reusing CommandAck:
// a parameter write isn't a Command.action (no ward_id-scoped executor
// queue, no EXECUTING/async phase - MAVSDK's set_param_* calls are
// synchronous), and CommandAck's status enum has no shape for "the value
// the vehicle actually confirmed," which param carries here on success.
message ParamAck {
  string request_id = 1;
  string ward_id = 2;
  ParamAckStatus status = 3;
  string message = 4;
  Param param = 5;                 // the value the vehicle confirmed; set only on SUCCESS
}
