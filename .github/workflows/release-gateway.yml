# Publishes real karshipta_gateway/karshipta_herald release binaries. Nothing
# in this repo did this before: ci.yml only builds and tests, it never
# publishes an artifact anywhere. karshipta-desktop's own binaries/README.md
# documents the exact swap-in contract this workflow's output satisfies:
# `karshipta_gateway-<target-triple>[.exe]`, built with
# -DKARSHIPTA_GATEWAY_ENABLE_MAVLINK=ON -DKARSHIPTA_GATEWAY_ENABLE_RELAY=ON.
#
# Two flavors (matching gateway/CMakeLists.txt's KARSHIPTA_GATEWAY_ENABLE_MAVLINK
# product split): "full" (karshipta_gateway, MAVLink+relay) and "herald-only"
# (karshipta_herald, no MAVLink, for self-hosters who only want Herald
# ingestion). Only "full" builds with relay - Herald ingestion is plain
# HTTP (gateway/docs/herald-ingest.md), it never has the NAT-traversal
# problem relay solves, so herald-only has no reason to link relayly at
# all, on any platform. Windows' "full" flavor now builds relay ON too:
# relayly's C++ SDK shipped Windows support (mbedTLS-based TLS, see its own
# sdk/cpp/README.md), and gateway/CMakeLists.txt's Windows guard was
# removed to match. This is the first time this workflow has actually
# built Windows-with-relay - watch that job's leg closely; if it fails,
# that is real, previously untested surface, not a flake to retry past.
#
# Unsigned. Code signing (macOS notarization, Windows Authenticode) needs real
# Apple Developer / Azure Trusted Signing credentials that do not exist yet -
# not something to fake or skip past silently, see RELEASE-PLAN.md.

name: release-gateway

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # x86_64-apple-darwin (Intel Mac) is not built here: GitHub retired
          # macos-13 (confirmed: gone from actions/runner-images' current
          # image list, deprecated Feb 2026) and no longer offers any free
          # x64 macOS hosted runner at all - the only x64 Mac labels left
          # (macos-15-large, macos-14-large) are paid "large runners", a
          # billing change, not a workflow fix. arm64 covers every Mac sold
          # since late 2020; revisit Intel support later if real demand
          # shows up (paid large runner or a self-hosted Intel Mac).
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
        flavor: [full, herald-only]
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7

      # llvm: GitHub's macos-14/macos-13 runners ship Xcode 15.4, whose
      # bundled libc++ has no std::jthread/std::stop_token - this codebase
      # uses both throughout (WardManager, CommandExecutor, WardMission).
      # ci.yml never caught this because it only builds the gateway on
      # ubuntu-22.04; this is the first workflow to ever build it on macOS
      # CI. Verified directly (this machine has a newer Xcode where the
      # system compiler already supports it, so this needed a real,
      # dedicated check): Homebrew's LLVM clang + its own bundled libc++
      # compiles, links, and *runs* correctly against Homebrew's MAVSDK/
      # spdlog (themselves built with Apple's system libc++) - libc++'s ABI
      # stability across the two is what makes this safe, not assumed.
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mavsdk spdlog llvm

      # libssl-dev: only needed once a build actually turns relay on
      # (KARSHIPTA_GATEWAY_ENABLE_RELAY=ON forces ixwebsocket's USE_TLS=ON,
      # which needs OpenSSL to configure at all) - ci.yml's own gateway job
      # never sets that flag, so this is a real, previously-unexercised
      # dependency, found by actually building this configuration locally in
      # a matching Ubuntu 22.04 container rather than assumed.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/mavsdk.deb https://github.com/mavlink/MAVSDK/releases/download/v3.17.1/libmavsdk-dev_3.17.1_ubuntu22.04_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/mavsdk.deb libspdlog-dev protobuf-compiler libprotobuf-dev patchelf libssl-dev

      # Windows has no package manager equivalent for these (see
      # docs/quickstart-windows.md, which this mirrors step for step) - MAVSDK
      # is a prebuilt zip, spdlog/protobuf are built from source and cached by
      # their pinned tags so only the first run on a given cache generation
      # pays the full build cost. GTest (that doc's step 5) is skipped: a
      # release build has no need for it.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Cache Windows vendored dependencies
        if: runner.os == 'Windows'
        id: win-cache
        uses: actions/cache@v6
        with:
          path: gateway/third_party
          key: win-third-party-mavsdk3.17.1-spdlog1.14.1-protobuf21.12-mbedtls3.6.7

      - name: Vendor MAVSDK (Windows)
        if: runner.os == 'Windows' && steps.win-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o mavsdk.zip https://github.com/mavlink/MAVSDK/releases/download/v3.17.1/mavsdk-windows-x64.zip
          mkdir -p gateway/third_party/mavsdk
          unzip -q mavsdk.zip -d gateway/third_party/mavsdk

      - name: Vendor spdlog (Windows)
        if: runner.os == 'Windows' && steps.win-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch v1.14.1 --depth 1 https://github.com/gabime/spdlog.git spdlog-src
          cmake -S spdlog-src -B spdlog-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/gateway/third_party/spdlog"
          cmake --build spdlog-src/build
          cmake --install spdlog-src/build

      - name: Vendor mbedTLS (Windows)
        # ixwebsocket defaults to mbedTLS on Windows (no Secure Transport
        # like macOS, no ubiquitous system OpenSSL like Linux's libssl-dev -
        # see gateway/CMakeLists.txt's USE_TLS comment), and relay is now ON
        # for every Windows build, not just non-Windows. Hand-vendored the
        # same way as spdlog/protobuf above, not via vcpkg.json (which does
        # not list mbedtls and is not actually installed anywhere in this
        # workflow today - that vcpkg path in CMakeLists.txt is for anyone
        # building locally with vcpkg, unused by CI).
        if: runner.os == 'Windows' && steps.win-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch v3.6.7 --depth 1 --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cmake -S mbedtls-src -B mbedtls-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PROGRAMS=OFF \
            -DENABLE_TESTING=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/gateway/third_party/mbedtls"
          cmake --build mbedtls-src/build
          cmake --install mbedtls-src/build

      - name: Vendor protobuf (Windows)
        if: runner.os == 'Windows' && steps.win-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch v21.12 --recurse-submodules --depth 1 https://github.com/protocolbuffers/protobuf.git protobuf-src
          cmake -S protobuf-src -B protobuf-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=ON \
            -Dprotobuf_MSVC_STATIC_RUNTIME=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/gateway/third_party/protobuf"
          cmake --build protobuf-src/build
          cmake --install protobuf-src/build

      - name: Configure
        shell: bash
        run: |
          cxxflags=""
          ldflags=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # See the macOS dependency-install step's comment: Homebrew's
            # LLVM clang + its own libc++ is what actually has std::jthread.
            # Homebrew's clang binary is a plain LLVM clang, not Apple's
            # /usr/bin/clang wrapper - it does not auto-detect and inject
            # -isysroot the way the wrapper does, so without it clang can
            # silently pick up the C standard library headers in the wrong
            # search-path order relative to libc++'s own wrapper headers
            # (the exact "tried including X.h but didn't find libc++'s X.h
            # header" error this surfaced as, found only by an actual CI
            # run - this machine's own environment happens to resolve the
            # SDK path some other way and never hit it).
            export CC=/opt/homebrew/opt/llvm/bin/clang
            export CXX=/opt/homebrew/opt/llvm/bin/clang++
            cxxflags="-stdlib=libc++ -isysroot $(xcrun --sdk macosx --show-sdk-path)"
            ldflags="-L/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++"
          fi
          export CXXFLAGS="$cxxflags"
          export LDFLAGS="$ldflags"
          mavlink_flag="ON"
          [[ "${{ matrix.flavor }}" == "herald-only" ]] && mavlink_flag="OFF"
          # herald-only never needs relay: Herald ingestion is plain HTTP,
          # not the MAVLink-over-untrusted-network problem relay solves.
          relay_flag="ON"
          [[ "${{ matrix.flavor }}" == "herald-only" ]] && relay_flag="OFF"
          generator=()
          [[ "${{ runner.os }}" == "Windows" ]] && generator=(-G Ninja)
          cmake -S gateway -B gateway/build "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARSHIPTA_GATEWAY_ENABLE_MAVLINK="$mavlink_flag" \
            -DKARSHIPTA_GATEWAY_ENABLE_RELAY="$relay_flag"

      - name: Build
        shell: bash
        run: cmake --build gateway/build -j

      - name: Determine artifact name
        id: name
        shell: bash
        run: |
          product="karshipta_gateway"
          [[ "${{ matrix.flavor }}" == "herald-only" ]] && product="karshipta_herald"
          echo "artifact=${product}-${{ matrix.platform.triple }}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          binary="gateway/build/src/karshipta_gateway"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="gateway/build/src/karshipta_gateway.exe"
          ./gateway/scripts/package-release.sh "$binary" "${{ steps.name.outputs.artifact }}"

      # Proves the archive is genuinely self-contained: extracted somewhere
      # that is not the build tree (which still has every Homebrew/apt/
      # third_party path the binary was linked against available), so a
      # missing relinked dependency shows up here instead of only on a real
      # customer machine. karshipta_gateway takes no CLI arguments and never
      # exits on its own - this checks it gets far enough to log its normal
      # startup line, not that it runs a full mission. 40s wait on macOS:
      # verified locally that a freshly re-signed binary plus its ~100
      # freshly re-signed dylibs (Homebrew LLVM's own libc++/libc++abi/
      # libunwind now included) take a real, variable amount of time before
      # the OS's one-time Gatekeeper/AMFI verification clears and the
      # process's first log line appears - measured 13-35s across repeated
      # local runs, not a fixed number, so this leaves real margin rather
      # than matching the fastest observed run.
      - name: Verify it starts standalone
        shell: bash
        run: |
          set -e
          artifact="${{ steps.name.outputs.artifact }}"
          extract_dir="$(mktemp -d)"
          tar -xzf "$artifact.tar.gz" -C "$extract_dir"
          cd "$extract_dir/$artifact"
          binfile="karshipta_gateway"
          [[ -f karshipta_gateway.exe ]] && binfile="karshipta_gateway.exe"
          ./"$binfile" >start.log 2>&1 &
          pid=$!
          wait_s=5
          [[ "${{ runner.os }}" == "macOS" ]] && wait_s=40
          sleep "$wait_s"
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "binary exited early, log:"
            cat start.log
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "started ok, log:"
          cat start.log
          grep -q "listening" start.log || {
            echo "no 'listening' line found in startup log"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            ${{ steps.name.outputs.artifact }}.tar.gz
            ${{ steps.name.outputs.artifact }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh release create infers the target repo from a local git
          # checkout; this job has none (only actions/download-artifact
          # above, no actions/checkout - it never needs repo files), so it
          # fails with "not a git repository" without this. Found only by
          # a real CI run reaching this job, since every earlier local test
          # only ever exercised the build/package/verify steps, never
          # publish. GH_REPO makes the target explicit instead.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "karshipta ${{ github.ref_name }}" \
            --notes "Unsigned gateway binaries. karshipta_gateway is the full build (MAVLink + relay, all platforms including Windows - see gateway/docs/relay-transport.md). karshipta_herald is the MAVLink-disabled build for Herald-only ingestion (see gateway/docs/herald-ingest.md). Each archive includes a .sha256 checksum." \
            dist/*
