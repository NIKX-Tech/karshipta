name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Validate schema
        run: protoc -I proto --descriptor_set_out=/dev/null proto/karshipta/v1/*.proto

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate protobuf types
        run: npm run proto:gen
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build

  gateway:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [{ cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ }]
    steps:
      - uses: actions/checkout@v7
      - name: Install MAVSDK and spdlog
        run: |
          curl -fsSL -o /tmp/mavsdk.deb https://github.com/mavlink/MAVSDK/releases/download/v3.17.1/libmavsdk-dev_3.17.1_ubuntu22.04_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/mavsdk.deb libspdlog-dev
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S gateway -B gateway/build -DKARSHIPTA_GATEWAY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build gateway/build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir gateway/build --output-on-failure
