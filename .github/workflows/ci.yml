name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Validate schema
        run: protoc -I proto --descriptor_set_out=/dev/null proto/karshipta/v1/*.proto

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate protobuf types
        run: npm run proto:gen
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build

  gateway:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [{ cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ }]
    steps:
      - uses: actions/checkout@v7
      - name: Install MAVSDK, spdlog, protobuf
        run: |
          curl -fsSL -o /tmp/mavsdk.deb https://github.com/mavlink/MAVSDK/releases/download/v4.0.6/libmavsdk-dev_4.0.6_ubuntu22.04_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/mavsdk.deb libspdlog-dev protobuf-compiler libprotobuf-dev
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S gateway -B gateway/build -DKARSHIPTA_GATEWAY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build gateway/build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir gateway/build --output-on-failure -E HandleRemoveWardRejectsWhileAirborne
      # HandleRemoveWardRejectsWhileAirborne runs two full MAVSDK cores (the
      # manager's and a fake autopilot's own) in one test, polling MAVSDK's
      # cached telemetry for a stable reading before it's safe to proceed.
      # On this runner's limited CPU that reading has been observed to flap
      # under load (see issue #237 and the same class of flake documented
      # in ward_manager.cpp's run_reconnect_loop) - not a logic bug, and not
      # fixed by three prior rounds of widening the test's own timing
      # margins. Isolated here with its own retry budget so a genuine
      # regression still fails the job, but a transient scheduling flake on
      # a loaded runner doesn't.
      - name: Test (HandleRemoveWardRejectsWhileAirborne, retried for known CI flakiness - see #237)
        run: ctest --test-dir gateway/build --output-on-failure -R HandleRemoveWardRejectsWhileAirborne --repeat until-pass:3


  # karshipta-herald: the MAVLink-disabled release artifact (generic tags/GPS
  # devices, no drones - see gateway/CLAUDE.md's KARSHIPTA_GATEWAY_ENABLE_MAVLINK
  # option). Deliberately does NOT install MAVSDK here: the entire point of
  # this job is proving the build genuinely does not need it, not just that
  # the flag compiles while MAVSDK sits there unused. No test step - the
  # existing suite constructs real WardManager instances throughout and is
  # not yet adapted for this configuration (KARSHIPTA_GATEWAY_BUILD_TESTS=ON
  # combined with this flag OFF is a hard CMake error, on purpose).
  gateway-herald-only:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [{ cc: gcc, cxx: g++ }, { cc: clang, cxx: clang++ }]
    steps:
      - uses: actions/checkout@v7
      - name: Install spdlog, protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y libspdlog-dev protobuf-compiler libprotobuf-dev
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S gateway -B gateway/build -DKARSHIPTA_GATEWAY_ENABLE_MAVLINK=OFF
      - name: Build
        run: cmake --build gateway/build -j "$(nproc)"
