# Serves the console's static build (console/Dockerfile). One real route
# today (src/routes/+page.svelte is the whole app), so the SPA fallback below
# is mostly future-proofing for when that stops being true - not currently
# exercised by anything.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed filenames (immutable per SvelteKit's own convention):
    # safe to cache forever, a new build always ships new filenames.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx:1.27-alpine's bundled mime.types has no .mjs entry, so it falls
    # back to application/octet-stream - which browsers refuse to execute
    # as a module worker, silently breaking maplibre-gl's worker
    # (scripts/copy-maplibre-worker.mjs) and every GeoJSON layer on the map.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
