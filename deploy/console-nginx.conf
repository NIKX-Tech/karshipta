# Serves the console's static build (console/Dockerfile). One real route
# today (src/routes/+page.svelte is the whole app), so the SPA fallback below
# is mostly future-proofing for when that stops being true - not currently
# exercised by anything.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed filenames (immutable per SvelteKit's own convention):
    # safe to cache forever, a new build always ships new filenames.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx:1.27-alpine's bundled mime.types has no entry for .mjs (only
    # .js), so it falls back to application/octet-stream - which browsers
    # refuse to execute as a module worker. That silently broke every
    # GeoJSON layer on the map (trails, zones, geozones, mission route):
    # maplibre-gl's own worker (scripts/copy-maplibre-worker.mjs's whole
    # reason for existing) never actually starts, so geojson-vt never tiles
    # anything, for demo wards and gateway wards alike - confirmed directly
    # (curl -I showed application/octet-stream on the served file). No
    # console error either: maplibre just tiles nothing forever, which
    # looks exactly like a data bug, not a missing worker.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
