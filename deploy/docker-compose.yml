# Karshipta demo environment.
# SITL wards, the gateway, and the console are all wired up: `docker compose
# up` alone gets a browser-usable console at http://localhost:5173, with all
# three SITL wards auto-seeded and flyable (main.cpp's seed list).
#
# Each SITL instance gets a distinct PX4_INSTANCE (the `-i` flag, driven by
# PX4_INSTANCE_NUM below) so it reports a distinct MAV_SYS_ID and sends its
# offboard/SDK stream to a distinct target port - both must match main.cpp's
# seed list (mavlink_system_id, connection_url ports) exactly, or the
# gateway's shared-Mavsdk-core discovery resolves a second/third ward to
# whichever system connected first instead of its own instance.

# px4io/px4-sitl's PX4 core refuses to send MAVLink to a non-localhost
# target unless told otherwise ("MAVLink only on localhost"), a regression
# its own entrypoint does not account for (same root cause as
# github.com/PX4/PX4-Autopilot/issues/25118). Fixed below by restarting the
# GCS and offboard/SDK mavlink instances a few seconds after boot, once
# each instance's broadcast param is a real registered handle rather than a
# pre-registration placeholder. PX4's client tools (px4-param, px4-mavlink)
# default to instance 0's IPC socket, so any instance above 0 needs
# --instance explicitly or the command just fails silently.
x-log-limits: &log-limits
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# -d: daemon mode, no interactive pxh shell (PX4 otherwise redraws its own
# prompt forever with no tty attached, which json-file's default unrotated
# logging will happily grow without bound).
x-px4-broadcast-fix: &px4-broadcast-fix
  environment:
    PX4_INSTANCE_NUM: '0'
    # px4io/px4-sitl's own px4-rc.sihsim reads these directly if set, in
    # preference to its compiled-in default (Zurich Irchel). Amsterdam,
    # matching console/src/routes/+page.svelte's DEFAULT_MAP_CENTER, since
    # that is where this project is based.
    PX4_HOME_LAT: '52.3676'
    PX4_HOME_LON: '4.9041'
    PX4_HOME_ALT: '2'
  entrypoint:
    - sh
    - -c
    - |
      instance="$$PX4_INSTANCE_NUM"
      /opt/px4/bin/px4-entrypoint.sh -i "$$instance" -d &
      px4_pid=$$!
      (
        sleep 8
        gcs_port=$$((18570 + instance))
        offboard_port=$$((14580 + instance))
        offboard_remote=$$((24540 + instance))
        for n in 0 1 2; do
          /opt/px4/bin/px4-param --instance "$$instance" set "MAV_$${n}_BROADCAST" 1 >/dev/null 2>&1
        done
        /opt/px4/bin/px4-mavlink --instance "$$instance" stop -u "$$gcs_port" >/dev/null 2>&1
        /opt/px4/bin/px4-mavlink --instance "$$instance" start -x -t 192.168.65.254 -u "$$gcs_port" -r 4000000 -f >/dev/null 2>&1
        /opt/px4/bin/px4-mavlink --instance "$$instance" stop -u "$$offboard_port" >/dev/null 2>&1
        /opt/px4/bin/px4-mavlink --instance "$$instance" start -x -t 192.168.65.254 -u "$$offboard_port" -r 4000000 -f -m onboard -o "$$offboard_remote" >/dev/null 2>&1
      ) &
      wait "$$px4_pid"
    - sh
  <<: *log-limits

services:
  sitl-1:
    image: px4io/px4-sitl:latest
    <<: *px4-broadcast-fix
    ports:
      - "14550:14550/udp"

  sitl-2:
    image: px4io/px4-sitl:latest
    <<: *px4-broadcast-fix
    environment:
      PX4_INSTANCE_NUM: '1'
    ports:
      - "14551:14550/udp"

  sitl-3:
    image: px4io/px4-sitl:latest
    <<: *px4-broadcast-fix
    environment:
      PX4_INSTANCE_NUM: '2'
    ports:
      - "14552:14550/udp"

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    <<: *log-limits
    volumes:
      - ./gateway-config.yaml:/app/gateway/config/gateway.yaml:ro
    ports:
      - "8765:8765"
      # PX4 SITL sends its MAVLink stream to Docker Desktop's fixed
      # host-gateway address (192.168.65.254), so these are host port
      # publishes matching each seeded ward's connection_url, not something
      # resolved through the compose network's own DNS/bridge.
      - "24540:24540/udp"
      - "24541:24541/udp"
      - "24542:24542/udp"
      # Herald HTTP ingestion (github issue #101): lets a Herald source
      # running on the host (or reachable from it) POST to the gateway
      # inside this compose network. See gateway-config.yaml's herald block.
      - "8766:8766"
    depends_on: [sitl-1, sitl-2, sitl-3]

  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
      args:
        # Baked into the static build at image-build time (see the
        # Dockerfile's own comment: no server left at container-start to
        # read a runtime env var from). Points at the gateway's published
        # host port, not the compose network's internal DNS name - this
        # value is read by the operator's browser on the host, never by
        # anything inside the container network.
        PUBLIC_GATEWAY_WS_URL: ws://localhost:8765
    <<: *log-limits
    ports:
      - "5173:80"
    depends_on: [gateway]
